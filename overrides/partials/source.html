{# Use cached badges instead of Material's per-visitor GitHub API requests. #}
<a href="{{ config.repo_url }}" title="{{ lang.t('source') }}" class="md-source">
  <div class="md-source__icon md-icon">
    {% set icon = config.theme.icon.repo or "fontawesome/brands/git-alt" %}
    {% include ".icons/" ~ icon ~ ".svg" %}
  </div>
  <div class="md-source__repository">
    {{ config.repo_name }}
    <div class="octron-repo-stats" style="display: flex; align-items: center; gap: 4px; margin-top: 2px;">
      <img
        src="https://img.shields.io/github/stars/OCTRON-tracking/OCTRON-GUI?style=flat-square&amp;label=Stars&amp;labelColor=000000&amp;color=000000"
        alt="GitHub stars"
        height="16"
        style="display: block; height: 16px; width: auto; max-width: none; mix-blend-mode: screen;"
      />
      <img
        src="https://img.shields.io/github/forks/OCTRON-tracking/OCTRON-GUI?style=flat-square&amp;label=Forks&amp;labelColor=000000&amp;color=000000"
        alt="GitHub forks"
        height="16"
        style="display: block; height: 16px; width: auto; max-width: none; mix-blend-mode: screen;"
      />
    </div>
  </div>
</a>
