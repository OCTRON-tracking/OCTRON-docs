{# Use cached badges instead of Material's per-visitor GitHub API requests. #}
<a href="{{ config.repo_url }}" title="{{ lang.t('source') }}" class="md-source">
  <div class="md-source__icon md-icon">
    {% set icon = config.theme.icon.repo or "fontawesome/brands/github" %}
    {% include ".icons/" ~ icon ~ ".svg" %}
  </div>
  <div class="md-source__repository">
    {{ config.repo_name }}
    <div class="octron-repo-stats" style="display: flex; align-items: center; gap: 8px; margin-top: 1px;">
      <span style="display: inline-flex; align-items: center;">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round;">
          <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>
        </svg>
        <img
          src="https://img.shields.io/github/stars/OCTRON-tracking/OCTRON-GUI?style=flat-square&amp;label=&amp;labelColor=000000&amp;color=000000"
          alt="GitHub stars"
          height="24"
          style="display: block; height: 24px; width: auto; max-width: none; margin-left: -3px; mix-blend-mode: screen;"
        />
      </span>
      <span style="display: inline-flex; align-items: center;">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round;">
          <circle cx="6" cy="4" r="2.5"/>
          <circle cx="18" cy="4" r="2.5"/>
          <circle cx="6" cy="20" r="2.5"/>
          <path d="M6 6.5v11M18 6.5V9a5 5 0 0 1-5 5H6"/>
        </svg>
        <img
          src="https://img.shields.io/github/forks/OCTRON-tracking/OCTRON-GUI?style=flat-square&amp;label=&amp;labelColor=000000&amp;color=000000"
          alt="GitHub forks"
          height="24"
          style="display: block; height: 24px; width: auto; max-width: none; margin-left: -3px; mix-blend-mode: screen;"
        />
      </span>
    </div>
  </div>
</a>
